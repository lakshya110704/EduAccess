target-version = "py312"
line-length = 120
extend-exclude = ["eduaccess-env", "graphify-out", "staticfiles"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports/variables, undefined names
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # flake8-bugbear: likely bugs
    "DJ",  # flake8-django: Django-specific pitfalls
    "UP",  # pyupgrade: modern Python syntax
]

[lint.per-file-ignores]
# Migrations are generated by Django; don't lint them.
"*/migrations/*.py" = ["ALL"]

[format]
quote-style = "single"
