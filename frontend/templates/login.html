{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EduAccess - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="{% static 'styles.css' %}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="{% static 'role-switch.js' %}" defer></script>
</head>
<body class="login-body" data-theme="{% if selected_role == 'professor' %}professor{% else %}student{% endif %}">
  <div class="background-blur"></div>
  <div class="login-container">
    <div class="logo-container">
      <img src="{% static 'assets/logo.png' %}" alt="EduAccess Logo" class="logo">
    </div>
    <h1><i class="fas {% if selected_role == 'professor' %}fa-chalkboard-teacher{% else %}fa-user-graduate{% endif %} role-icon" data-role-icon></i> EduAccess</h1>
    {% for message in messages %}
      <div class="flash flash-{{ message.tags }}" role="alert">{{ message }}</div>
    {% endfor %}
    <form action="{% url 'login' %}" method="POST">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "role-switch.html" with selected=selected_role %}
      <input type="text" name="username" placeholder="👤 Username" autocomplete="username" required autofocus>
      <input type="password" name="password" placeholder="🔒 Password" autocomplete="current-password" required>
      <button type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
    <p class="signup-switch">New to EduAccess? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</body>
</html>
