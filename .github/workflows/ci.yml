name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install lint tools
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Python lint (ruff check)
        run: ruff check .

      - name: Python format (ruff format --check)
        run: ruff format --check .

      - name: JavaScript lint + format (biome ci)
        run: npx biome ci frontend/static

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduaccess
          POSTGRES_PASSWORD: eduaccess
          POSTGRES_DB: eduaccess
        ports:
          - 5432:5432
        # Don't start the tests until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U eduaccess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "True"
      DB_ENGINE: postgresql
      DB_NAME: eduaccess
      DB_USER: eduaccess
      DB_PASSWORD: eduaccess
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test api

  deploy:
    # Only commits that reached main and passed every check are deployed; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Join the tailnet as an ephemeral tag:ci node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy this commit on the homelab
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The homelab's authorized_keys forces deploy/deploy.sh; the "command" sent here is only the hash.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            homelab@homelab.tail2734e7.ts.net "$GITHUB_SHA"
